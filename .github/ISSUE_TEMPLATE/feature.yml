name: Feature
description: Something the CLI or the pod image should do
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What you want to do
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - CLI
        - Pod image
        - Platform side
        - Docs
    validations:
      required: true
