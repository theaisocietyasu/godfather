name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the checks of the old push.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: cli/uv.lock

      - name: Lint, format, compile, test and build the CLI
        run: make check-cli

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint the shell scripts and the Dockerfile
        run: make lint-image

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the pod base image
        uses: docker/build-push-action@v7
        with:
          context: ./docker-images/godfather-base
          push: false
          load: true
          tags: godfather-base:check
          cache-from: type=gha,scope=godfather-base
