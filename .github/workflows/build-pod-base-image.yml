name: Build and Push Pod Base Image

on:
  push:
    branches:
      - main
    paths:
      - 'docker-images/godfather-base/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.repository == 'theaisocietyasu/godfather'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set short sha
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push godfather-base image
        uses: docker/build-push-action@v6
        with:
          context: ./docker-images/godfather-base
          file: ./docker-images/godfather-base/Dockerfile
          push: true
          tags: |
            theaisocietyasu/godfather-base:latest
            theaisocietyasu/godfather-base:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=godfather-base
          cache-to: type=gha,mode=max,scope=godfather-base
