name: Build and Push Pod Base Image

on:
  push:
    branches:
      - main
    paths:
      - 'docker-images/godfather-base/**'
      - '.github/workflows/build-pod-base-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.repository == 'theaisocietyasu/godfather'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short sha
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push godfather-base image
        uses: docker/build-push-action@v7
        with:
          context: ./docker-images/godfather-base
          file: ./docker-images/godfather-base/Dockerfile
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: true
          tags: |
            ghcr.io/theaisocietyasu/godfather-base:latest
            ghcr.io/theaisocietyasu/godfather-base:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=godfather-base
          cache-to: type=gha,mode=max,scope=godfather-base
