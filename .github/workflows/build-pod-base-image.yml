name: Build and Push Pod Base Image

on:
  push:
    branches:
      - main
    paths:
      - 'docker-images/godfather-base/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.repository == 'theaisocietyasu/godfather'
    env:
      IMAGE: ghcr.io/theaisocietyasu/godfather-base
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the version and the short sha
        id: vars
        run: |
          echo "version=$(cat docker-images/godfather-base/VERSION)" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # A version tag is never moved to other content. An image change bumps VERSION.
      - name: Refuse a version that is already published
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.vars.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::$IMAGE:${{ steps.vars.outputs.version }} exists. Bump docker-images/godfather-base/VERSION."
            exit 1
          fi

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: ./docker-images/godfather-base
          load: true
          tags: godfather-base:candidate
          build-args: GODFATHER_BASE_VERSION=${{ steps.vars.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=godfather-base
          cache-to: type=gha,mode=max,scope=godfather-base

      - name: Test the image
        run: docker-images/godfather-base/tests/run.sh godfather-base:candidate

      - name: Push the image
        uses: docker/build-push-action@v7
        with:
          context: ./docker-images/godfather-base
          push: true
          build-args: GODFATHER_BASE_VERSION=${{ steps.vars.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.version }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=godfather-base
