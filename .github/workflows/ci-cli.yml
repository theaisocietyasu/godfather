name: CI CLI

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/ci-cli.yml'
  pull_request:
    paths:
      - 'cli/**'
      - '.github/workflows/ci-cli.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cli/pyproject.toml

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e cli/

      - name: Compile check
        run: python -m py_compile cli/godfather_cli/*.py

      - name: Build check
        run: |
          python -m pip install build
          python -m build cli/
