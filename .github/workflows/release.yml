name: GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists (created in the GitHub UI)"
            if [ -f "$notes" ]; then gh release edit "$TAG" --notes-file "$notes"; fi
          elif [ -f "$notes" ]; then
            gh release create "$TAG" --title "Godfather $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --title "Godfather $TAG" --generate-notes
          fi
