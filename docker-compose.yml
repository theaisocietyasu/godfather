version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: godfather_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - godfather_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: godfather_backend
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/godfather?authSource=admin
      - FLASK_ENV=development
      - RUNPOD_API_KEY=${RUNPOD_API_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
    networks:
      - godfather_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: godfather_frontend
    environment:
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - godfather_network

  nginx:
    image: nginx:alpine
    container_name: godfather_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - godfather_network

volumes:
  mongodb_data:

networks:
  godfather_network:
    driver: bridge