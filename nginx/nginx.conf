### 4. Authentication Flow            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;

**Old Flow (Clerk):**            proxy_set_header Connection 'upgrade';

1. User authenticates via Clerk            proxy_set_header Host $host;

2. Clerk provides JWT token            proxy_set_header X-Real-IP $remote_addr;

3. Components use `getToken()` to get auth token            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

4. API calls include `Authorization: Bearer ${token}` header            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache_bypass $http_upgrade;

**New Flow (NextAuth):**            

1. User authenticates via NextAuth (Discord OAuth)            # CORS headers for API

2. NextAuth creates session with Discord user data            add_header 'Access-Control-Allow-Origin' '*' always;

3. Components use `useSession()` to get session data            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;

4. API calls include `X-Discord-User-ID` header from session            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Discord-User-ID' always;

5. Backend verifies Discord user against Discord API            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            

