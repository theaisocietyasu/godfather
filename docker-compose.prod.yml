services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: godfather_backend
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://softwareTeam:Wt4qADxB0WsNK3tQ@cluster0.pj0m3k9.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0}
      - FLASK_ENV=production
      - RUNPOD_API_KEY=${RUNPOD_API_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
    ports:
      - "5000:5000"
    networks:
      - godfather_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: godfather_frontend
    environment:
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - godfather_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: godfather_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - godfather_network
    restart: unless-stopped

networks:
  godfather_network:
    driver: bridge
