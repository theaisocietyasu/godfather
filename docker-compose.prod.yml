services:
  mongodb:
    image: mongo:latest
    container_name: godfather_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - godfather_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: godfather_backend
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - FLASK_ENV=production
      - RUNPOD_API_KEY=${RUNPOD_API_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - godfather_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: godfather_frontend
    environment:
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - godfather_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: godfather_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - godfather_network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  godfather_network:
    driver: bridge
