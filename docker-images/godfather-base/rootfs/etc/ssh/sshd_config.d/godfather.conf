# Root logins use keys only: the backend key in authorized_keys, or a
# certificate from the Godfather user CA naming this pod as a principal.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
TrustedUserCAKeys /etc/ssh/godfather_user_ca.pub
AuthorizedPrincipalsFile /etc/ssh/godfather_principals/%u
