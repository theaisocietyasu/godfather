# Root logins use keys only: the backend key in authorized_keys, or a
# certificate from the Godfather user CA naming this pod as a principal.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
TrustedUserCAKeys /etc/ssh/godfather_user_ca.pub
AuthorizedPrincipalsFile /etc/ssh/godfather_principals/%u

# Every login is root with a key or a certificate. Member certificates carry
# no-port-forwarding; remote forwards are off for every login.
AllowTcpForwarding local
GatewayPorts no
X11Forwarding no
PermitTunnel no
AllowStreamLocalForwarding no
PermitUserEnvironment no
PermitUserRC no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
